<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce - Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .register-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 550px;
      text-align: center;
    }

    .register-card img {
      width: 50px;
      margin-bottom: 20px;
    }

    .register-card .form-control {
      border-radius: 8px;
    }

    .register-card .btn-primary {
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .register-card .form-check-label {
      margin-left: 5px;
    }

    .register-card a {
      text-decoration: none;
    }

  </style>
</head>
<body>
  <div class="register-card">
    <img src="../img/clothing-t-shirt-online-shop-logo-idea_667511-714.avif" alt="Logo">
    <h3 class="mb-2">Create Your Account</h3>
    <p class="text-muted mb-4">Fill the details below to register.</p>

    <form>
      <div class="mb-3 text-start">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email address" required>
      </div>

      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
              <path d="M8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="mb-3 text-start">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
              <path d="M8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="mb-3 text-start">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" required>
      </div>

      <div class="mb-3 text-start">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
      </div>

      <div class="mb-3 text-start">
        <label for="city" class="form-label">City</label>
        <input type="text" class="form-control" id="city" placeholder="Enter your city" required>
      </div>

      <button type="submit" class="btn btn-dark w-100">Register</button>

      <p class="mt-3">Already have an account? <a href="login.html">Sign In</a></p>
    </form>
  </div>

  <script>
    function togglePassword(id) {
      const passwordInput = document.getElementById(id);
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
