<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce - Shop - Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .login-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .login-card img {
      width: 50px;
      margin-bottom: 20px;
    }

    .login-card .form-control {
      border-radius: 8px;
    }

    .login-card .btn-primary {
      border-radius: 8px;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .login-card .social-btn {
      width: 48%;
      margin-top: 10px;
      border-radius: 8px;
    }

    .login-card .form-check-label {
      margin-left: 5px;
    }

    .login-card a {
      text-decoration: none;
    }

    .or-login {
      margin: 15px 0;
      font-size: 14px;
      color: #6c757d;
    }

  </style>
</head>
<body>
  <div class="login-card">
    <img src="../img/clothing-t-shirt-online-shop-logo-idea_667511-714.avif" alt="Logo">
    <h3 class="mb-2">Welcome Back to E-Commerce-Shop</h3>
    <p class="text-muted mb-4">Enter your username and password to continue.</p>

    <form>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email address">
      </div>

      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Enter your password">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
              <path d="M8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="#">Forgot password</a>
      </div>

      <button type="submit" class="btn btn-dark w-100">Sign In</button>

      <div class="or-login">Or login with</div>

      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-outline-danger social-btn">Google</button>
        <button type="button" class="btn btn-outline-dark social-btn">Apple</button>
      </div>

      <p class="mt-3">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
