<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Admin</title>
    <script
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js"
      type="module"
    ></script>

    <!-- link bs  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- icon bs  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- sweet alert 2  -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .containerFormLogin {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 40px;
        background-color: #eee;
        border-radius: 20px;
        max-width: 900px;
        width: 100%;
        box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.4);
      }

      .contentSideLeft {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .containerImage {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .containerSideRight {
        width: 100%;
      }

      dotlottie-wc {
        max-width: 300px;
        min-height: 300px;
        width: 100%;
        object-fit: cover;
      }

      @media (max-width: 768px) {
        .containerFormLogin {
          grid-template-columns: repeat(1, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- form login start  -->
    <div class="containerFormLogin">
      <div class="containerSideLeft">
        <div class="containerImage">
          <dotlottie-wc
            src="https://lottie.host/35910821-a782-4c7d-b862-a8561e4cf540/f0mlxUZ140.lottie"
            autoplay
            loop
          ></dotlottie-wc>
        </div>
        <div class="contentSideLeft">
          <h5 class="fs-5 fw-bold">Don't have account yet?</h5>
          <p class="text-center text-secondary">
            Contact us at <a href="">vongsokpheak@gmail.com</a> and we will take
            care of everything!!
          </p>
        </div>
      </div>

      <div class="containerSideRight">
        <form id="formLoginAdmin">
          <h2 class="fw-bold text-center">Login</h2>
          <p class="text-center text-secondary">
            Login with your admin credentials.
          </p>
          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control"
              id="floatingInput"
              placeholder="name@example.com"
            />
            <label for="floatingInput">Email address</label>
          </div>
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="floatingPassword"
              placeholder="Password"
            />
            <label for="floatingPassword">Password</label>
          </div>
          <div class="d-flex justify-content-end mb-3">
            <a href="#" class="fw-bold">Forget password?</a>
          </div>

          <button class="btn btn-primary w-100 fw-bold">Login</button>
        </form>
      </div>
    </div>
    <!-- form login end  -->

    <script>
      const formLoginAdmin = document.getElementById("formLoginAdmin");
      formLoginAdmin.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("floatingInput").value;
        const password = document.getElementById("floatingPassword").value;

        try {
          const res = await fetch("http://127.0.0.1:3000/loginAdmin", {
            method: "POST",
            credentials: "include",
            headers: { "Content-type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const message = await res.json();
          if (res.ok) {
            Swal.fire({
              icon: "success",
              title: "Successfully",
              text: message,
            }).then(() => {
              window.location.href = "index.html";
            });
          } else {
            Swal.fire({
              icon: "error",
              title: "Oops...",
              text: message,
            });
          }
        } catch (err) {
          Swal.fire({
            icon: "error",
            title: "Oops...",
            text: err.message,
          });
        }
      });
    </script>
  </body>
</html>
