<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Dasboard</title>

    <!-- link bs  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- icon bs  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- link css  -->
    <link rel="stylesheet" href="css/css.css" />

    <!-- sweet alert 2  -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <!-- container dasboard start  -->
    <div class="containerDasboard">
      <!-- side bar start -->
      <aside class="sidbar">
        <div class="containerLogo">
          <a href="index.html" class="fs-1 nav-link">Logo</a>
        </div>

        <div class="containerSidebarBtn">
          <div class="btnSidebar">
            <i class="bi bi-layout-sidebar-inset"></i>
          </div>
        </div>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="index.html" class="nav-link fw-bold"
              ><i class="bi bi-house-door-fill"></i>
              <span class="txt-link">Dasboard</span></a
            >
          </li>
          <li class="nav-item">
            <a href="order.html" class="nav-link fw-bold"
              ><i class="bi bi-bag-fill"></i>
              <span class="txt-link">Order</span></a
            >
          </li>
           <li class="nav-item">
            <a href="categories.html" class="nav-link fw-bold"
              ><i class="bi bi-tag-fill"></i></i>
              <span class="txt-link">Categories</span></a
            >
          </li>

          <li class="nav-item active">
            <a href="product.html" class="nav-link fw-bold"
              ><i class="bi bi-box-fill"></i>
              <span class="txt-link">Product</span></a
            >
          </li>
          <li class="nav-item">
            <a href="customer.html" class="nav-link fw-bold"
              ><i class="bi bi-people-fill"></i>
              <span class="txt-link">Customer</span></a
            >
          </li>
        </ul>
      </aside>
      <!-- side bar end -->

      <!-- overlay sidbar start  -->
      <div class="overlaySidebar"></div>
      <!-- overlay sidbar end  -->

      <!-- container right start -->
      <div class="main">


       <div class="containerLink">
        <!-- link content start  -->
        <div class="linkContent">
          <h4 class="fw-bold fs-4">Product</h4>
        </div>
        <!-- link content end  -->

        <div class="containerProfile">
          <div class="profile">
            <div class="imgProfile">
              <img src="img/Default_pfp.svg.png" alt="default">
            </div>

            <div class="containerMenu">
              <div class="menu">
              <i class="bi bi-three-dots-vertical"></i>
            </div>

            <div class="contentMenu">
              <button class="menuItem btn btn-primary"><i class="bi bi-person-fill"></i> Profile</button>
              <div class="containerdarkMOde">
                <div class="form-check form-switch">
  <input class="form-check-input darkBtn" data-darkmode="dark" type="checkbox" role="switch" id="switchCheckDefault">
  <label class="form-check-label fw-bold darkmodeContent" for="switchCheckDefault">Dark</label>
</div>
              </div>
              <button class="menuItem btn btn-danger"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
            </div>

            <div class="btnSidebarSmall">
          <div class="smallBtn">
            <i class="bi bi-layout-sidebar-inset"></i>
          </div>
        </div>

          </div>

        </div>

        
      </div>

      <div class="contianerAddNewCustomer">
        <div>Product List</div>
        <button class="btnAddNewCs btnAddProduct">+ Add Product</button>
      </div>

      <div class="containerSeachProduct">
        <div class="containerProductSearch">
            <input type="search" class="form-control" id="searchPro" placeholder="Search...">
        </div>

        <div class="containerSearchStatus">
            <div class="containerStatusSearch">
                <select class="form-select" id="searchStatus" aria-label="Default select example">
  <option selected>All Status</option>
  <option>Publish</option>
  <option>Private</option>
</select>
            </div>

            <div class="containerSearchCate">
                <select class="form-select" id="selectCate" aria-label="Default select example">
  <option selected>All Categories</option>
</select>
            </div>
        </div>

      </div>

      <div class="containerTableProduct table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Categories</th>
                    <th>Size</th>
                    <th>Stock</th>
                    <th>Price</th>
                    <th>Brand</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tbodyProduct">
                <tr class="containerNoItemProduct">
                    <td colspan="9">No product yet!</td>
                </tr>

                <tr class="containerNotFoundProduct">
                  <td colspan="9">Not found!</td>
                </tr>
            </tbody>
        </table>
      </div>

      
      </div>

      <!-- container add product start -->
       <div class="containerAddProduct">
        <form id="formAddProduct">
            <h2 class="fs-2 mb-4 fw-bold">Add Product</h2>
            <div class="row">
                <div class="col-lg-6 col-12 mb-lg-0 mb-3">
                    <input type="text" class="form-control" id="nameProduct" placeholder="Product Name" required>
                </div>
                <div class="col-lg-6 col-12">
                    <select class="form-select" id="productSelecct" aria-label="Default select example" required>
  <option selected>Categories</option>
</select>


</div>
<div class="col-12 col-lg-6 my-3">
    <input type="text" class="form-control" id="imgURL" placeholder="Image URL" required>
</div>
<div class="col-12 col-lg-6 mt-lg-3 mb-lg-0 mb-3">
    <input type="text" class="form-control" id="brand" placeholder="Brand" required>
</div>
<div class="col-lg-6 col-12 mb-lg-0 mb-3">
                    <input type="number" class="form-control" id="stock" placeholder="Stock" required>
                </div>
                <div class="col-lg-6 col-12">
                    <input type="number" class="form-control" id="price" placeholder="Price" required>
                </div>

                <div class="col-12 my-3">
                    <textarea name="description" id="des" class="form-control" placeholder="Description"></textarea>
                </div>
            </div>

            <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox"  role="switch" data-status="Publish" id="status" checked>
  <label class="form-check-label" for="status">Publish</label>
</div>
            <div class="d-flex justify-content-end my-3"><button class="btn btn-primary">Add</button></div>
        </form>
        <button class="btnConcelEditCate addProductConcel"><i class="bi bi-x-lg"></i></button>
       </div>
      <!-- container add product end -->

      <!-- container edit product start -->
       <div class="containerAddProduct containerEditProduct">
        <form id="formEditProduct">
            <h2 class="fs-2 mb-4 fw-bold">Edit Product</h2>
            <div class="row">
                <div class="col-lg-6 col-12 mb-lg-0 mb-3">
                    <input type="text" class="form-control" id="nameProductEdit" placeholder="Product Name" required>
                </div>
                <div class="col-lg-6 col-12">
                    <select class="form-select" id="productSelectEdit" aria-label="Default select example" required>
  <option selected>Categories</option>
</select>


</div>
<div class="col-12 col-lg-6 my-3">
    <input type="text" class="form-control" id="imgURLEdit" placeholder="Image URL" required>
</div>
<div class="col-12 col-lg-6 mt-lg-3 mb-lg-0 mb-3">
    <input type="text" class="form-control" id="brandEdit" placeholder="Brand" required>
</div>
<div class="col-lg-6 col-12 mb-lg-0 mb-3">
                    <input type="number" class="form-control" id="stockEdit" placeholder="Stock" required>
                </div>
                <div class="col-lg-6 col-12">
                    <input type="number" class="form-control" id="priceEdit" placeholder="Price" required>
                </div>

                <div class="col-12 my-3">
                    <textarea name="description" id="desEdit" class="form-control" placeholder="Description"></textarea>
                </div>
            </div>

            <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox"  role="switch" data-status="Publish" id="statusEdit" checked>
  <label class="form-check-label" for="statusEdit">Publish</label>
</div>
            <div class="d-flex justify-content-end my-3"><button class="btn btn-primary">Update</button></div>
        </form>
        <button class="btnConcelEditCate editConcelProduct"><i class="bi bi-x-lg"></i></button>
       </div>
      <!-- container edit product end -->

      <!-- overlay add cate start  -->
       <div class="overlayAddCate"></div>
      <!-- overlay add cate end  -->

    <!-- menu js start  -->
    <script src="js/menu.js"></script>

    <!-- darmode js start  -->
     <script src="js/darkmode.js"></script>

     <!-- add product js  -->
      <script src="js/addNewProduct.js"></script>
  </body>
</html>
