                <select class="form-select" id="searchStatus" aria-label="Default select example">

</select>

        </table>

      <!-- container add product start -->
<div class="containerAddProduct bg-dark text-white" data-bs-theme="dark">
  <form id="formAddProduct">
    <h2 class="fs-2 mb-4 fw-bold">Add Product</h2>
    <div class="row g-3">
      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="nameProduct" placeholder="Product Name" required>
          <label for="nameProduct">Product Name</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <select class="form-select" id="productSelecct" required>
            <option selected disabled>Categories</option>
          </select>
          <label for="productSelecct">Categories</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="imgURL" placeholder="Image URL" required>
          <label for="imgURL">Image URL</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="brand" placeholder="Brand" required>
          <label for="brand">Brand</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="number" class="form-control" id="stock" placeholder="Stock" required>
          <label for="stock">Stock</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="number" class="form-control" id="price" placeholder="Price" required>
          <label for="price">Price</label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-floating">
          <textarea class="form-control" id="des" placeholder="Description" style="height: 100px"></textarea>
          <label for="des">Description</label>
        </div>
      </div>
    </div>

    <div class="form-check form-switch mt-3">
      <input class="form-check-input" type="checkbox" id="status" data-status="Publish" checked>
      <label class="form-check-label" for="status">Publish</label>
    </div>

    <div class="d-flex justify-content-end my-3">
      <button class="btn btn-primary">Add</button>
    </div>
  </form>
  <button class="btnConcelEditCate addProductConcel"><i class="bi bi-x-lg"></i></button>
</div>
<!-- container add product end -->


      <!-- container edit product start -->
<div class="containerAddProduct containerEditProduct bg-dark text-white" data-bs-theme="dark">
  <form id="formEditProduct">
    <h2 class="fs-2 mb-4 fw-bold">Edit Product</h2>
    <div class="row g-3">
      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="nameProductEdit" placeholder="Product Name" required>
          <label for="nameProductEdit">Product Name</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <select class="form-select" id="productSelectEdit" required>
            <option selected disabled>Categories</option>
          </select>
          <label for="productSelectEdit">Categories</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="imgURLEdit" placeholder="Image URL" required>
          <label for="imgURLEdit">Image URL</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="brandEdit" placeholder="Brand" required>
          <label for="brandEdit">Brand</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="number" class="form-control" id="stockEdit" placeholder="Stock" required>
          <label for="stockEdit">Stock</label>
        </div>
      </div>

      <div class="col-lg-6 col-12">
        <div class="form-floating">
          <input type="number" class="form-control" id="priceEdit" placeholder="Price" required>
          <label for="priceEdit">Price</label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-floating">
          <textarea class="form-control" id="desEdit" placeholder="Description" style="height: 100px"></textarea>
          <label for="desEdit">Description</label>
        </div>
      </div>
    </div>

    <div class="form-check form-switch mt-3">
      <input class="form-check-input" type="checkbox" id="statusEdit" data-status="Publish" checked>
      <label class="form-check-label" for="statusEdit">Publish</label>
    </div>

    <div class="d-flex justify-content-end my-3">
      <button class="btn btn-primary">Update</button>
    </div>
  </form>
  <button class="btnConcelEditCate editConcelProduct"><i class="bi bi-x-lg"></i></button>
</div>
