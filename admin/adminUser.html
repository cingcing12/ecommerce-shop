    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>

    <!-- icon bs  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- link css  -->
    <link rel="stylesheet" href="css/css.css" />

    <!-- sweet alert 2  -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <!-- container dasboard start  -->
    <div class="containerDasboard">
      <!-- side bar start -->
      <aside class="sidbar">
        <div class="containerLogo">
          <a href="index.html" class="fs-1 nav-link">Logo</a>
        </div>

        <div class="containerSidebarBtn">
          <div class="btnSidebar">
            <i class="bi bi-layout-sidebar-inset"></i>
          </div>
        </div>

        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="index.html" class="nav-link fw-bold"
              ><i class="bi bi-house-door-fill"></i>
              <span class="txt-link">Dasboard</span></a
            >
          </li>
          <li class="nav-item">
            <a href="order.html" class="nav-link fw-bold"
              ><i class="bi bi-bag-fill"></i>
              <span class="txt-link">Order</span></a
            >
          </li>
           <li class="nav-item">
            <a href="categories.html" class="nav-link fw-bold"
              ><i class="bi bi-tag-fill"></i></i>
              <span class="txt-link">Categories</span></a
            >
          </li>

          <li class="nav-item">
            <a href="product.html" class="nav-link fw-bold"
              ><i class="bi bi-box-fill"></i>
              <span class="txt-link">Product</span></a
            >
          </li>
          <li class="nav-item">
            <a href="customer.html" class="nav-link fw-bold"
              ><i class="bi bi-people-fill"></i>
              <span class="txt-link">Customer</span></a
            >
          </li>

          <li class="nav-item active">
            <a href="adminUser.html" class="nav-link fw-bold"
              ><i class="bi bi-person-fill"></i>
              <span class="txt-link">Admin User</span></a
            >
          </li>

        </ul>
      </aside>
      <!-- side bar end -->

      <!-- overlay sidbar start  -->
      <div class="overlaySidebar"></div>
      <!-- overlay sidbar end  -->

      <!-- container right start -->
      <div class="main">


       <div class="containerLink">
        <!-- link content start  -->
        <div class="linkContent">
          <h4 class="fw-bold fs-4">Admin User</h4>
        </div>
        <!-- link content end  -->

        <div class="containerProfile">
          <div class="profile">
            <div class="imgProfile">
              <img src="img/Default_pfp.svg.png" alt="default">
            </div>

            <div class="containerMenu">
              <div class="menu">
              <i class="bi bi-three-dots-vertical"></i>
            </div>

            <div class="contentMenu">
              <button class="menuItem btn btn-primary btnProfile"><i class="bi bi-person-fill"></i> Profile</button>
              <div class="containerdarkMOde">
                <div class="form-check form-switch">
  <input class="form-check-input darkBtn" data-darkmode="dark" type="checkbox" role="switch" id="switchCheckDefault">
  <label class="form-check-label fw-bold darkmodeContent" for="switchCheckDefault">Dark</label>
</div>
              </div>
              <button class="menuItem btn btn-danger" id="logout"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
            </div>

            <div class="profileContainer bg-dark" data-id="" data-bs-theme="dark">
              <div class="containerImage">
                <div class="containerCover"></div>
                <div class="containerImageProfile">
                  <img src="img/Default_pfp.svg.png" alt="">
                  <h4 class="nameProfile text-white mt-3">VongSokpheak</h4>
                  <p class="emailProfile text-secondary">vongsokpheak@gmail.com</p>
                </div>
              </div>

              <div class="containerInformation">
                <h4 class="fw-bold fs-4 text-white mb-3">Information</h4>
                <div class="row">
                  <div class="col-12 mb-3">
                    <div class="form-floating">
      <input type="text" id="nameInput" class="form-control" placeholder="Name" readonly>
      <label for="nameInput">Name</label>
    </div>
    </div>
    <div class="col-12 mb-3">
      <div class="form-floating">
      <input type="text" id="emailInput" class="form-control" placeholder="Email" readonly>
      <label for="emailInput">Email</label>
    </div>
    </div>

    <div class="col-12 mb-3">
      <div class="form-floating">
      <input type="text" id="roleInput" class="form-control" placeholder="Role" readonly>
      <label for="roleInput">Role</label>
    </div>
    </div>
                </div>
              </div>

              <button class="btnConcelEditCate btnConcelProfile"><i class="bi bi-x-lg"></i></button>
            </div>

            <div class="btnSidebarSmall">
          <div class="smallBtn">
            <i class="bi bi-layout-sidebar-inset"></i>
          </div>
        </div>

          </div>

        </div>

        
      </div>

      <div class="contianerAddNewCustomer">
        <div>Admin User List</div>
        <button class="btnAddNewCs addAdminUser">+ Add admin</button>
      </div>

      <div class="containerSearchCs containerSearchAdminUser">
        <input type="search" class="form-control" id="searchAdminUser" placeholder="Search...">
      </div>

      <div class="containerTableCs table-responsive">
        <table class="table table-hover">
          <thead class="text-nowrap">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="tbodyAdminUser">
            <tr class="containerNoItemCs adminUserNoData">
              <td colspan="6">No admin user yet!</td>
            </tr>

            <tr class="adminNotFound">
              <td colspan="6">Not found!</td>
            </tr>
          </tbody>
        </table>
      </div>

      </div>

            <!-- container add admin start -->
<div class="containerAddProduct containerAddadmin bg-dark text-white" data-bs-theme="dark">
  <form id="formAddAdmin">
    <h2 class="fs-2 mb-4 fw-bold">Add admin</h2>
    <div class="row g-3">
      <div class="col-12">
        <div class="form-floating">
          <input type="text" class="form-control" id="nameAdmin" placeholder="Name" required>
          <label for="nameAdmin">Name</label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-floating">
            <select class="form-select" id="roleSelect" required>
              <option selected disabled>Role</option>
              <option >Superadmin</option>
              <option >Admin</option>
              <option >Admin For Delivery</option>
            </select>
            <label for="roleSelect">Role</label>
          </div>
      </div>

      <div class="col-12">
        <div class="form-floating">
          <input type="email" class="form-control" id="email" placeholder="Email" required>
          <label for="email">Email</label>
        </div>
      </div>


      <div class="col-12">
        <div class="form-floating">
          <input type="tel" class="form-control" id="phone" placeholder="Phone" required>
          <label for="phone">Phone</label>
        </div>
      </div>

      <div class="col-12">
        <div class="form-floating">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <label for="password">Password</label>
        </div>
      </div>

      
      
    </div>



    <div class="d-flex justify-content-end my-3">
      <button class="btn btn-primary">Add</button>
    </div>
  </form>
  <button class="btnConcelEditCate addAdminConcel"><i class="bi bi-x-lg"></i></button>
</div>
<!-- container add admin end -->

<!-- overlay add cate start  -->
       <div class="overlayAddCate"></div>
      <!-- overlay add cate end  -->

    <script src="js/menu.js"></script>

     <script src="js/darkmode.js"></script>

     <!-- adminuser js  -->
     <script src="js/adminuser.js"></script>

     <!-- checkAuthAdmin js  -->
       <script src="js/checkAuthAdmin.js"></script>

       <!-- logout js  -->
        <script src="js/logout.js"></script>

  </body>
</html>
